<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

    <!-- Link to Open Sans font. Copy this section to the head of new pages to use the font. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>

<body>
    <main>
        <div class="container">
            <h1>Log in</h1>
            <form>
                <fieldset>
                    <label for="email">Email</label>
                    <input type="text" id="email" name="email">
                </fieldset>
                <fieldset>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password">
                </fieldset>
                <fieldset>
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember me</label>
                </fieldset>
                <input type="submit" value="Log in" class="button-primary-dark">
            </form>
            <p>Or: <a href="signup.html">Sign up</a></p>
        </div>
    </main>
</body>
</html>
