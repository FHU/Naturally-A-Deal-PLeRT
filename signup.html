<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

    <!-- Link to Open Sans font. Copy this section to the head of new pages to use the font. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <!-- The logo sizes itself to fit the logo box. If you want to resize the logo, resize the logo box instead. -->
        <div class="logo-box">
            <a href="index.html"><img src="assets/images/Naturally-a-Deal-logo-white.webp" alt=""></a>
        </div>
        <nav>
            <ul class="navlist">
                <li><a href="catalog.html">Products</a></li>
                <!-- These other links lead to the original naturally a deal page, because it is notrelevant to what we are trying to redesign. -->
                <li><a href="https://naturallyadeal.com/about-us/">About us</a></li>
                <li><a href="https://naturallyadeal.com/products-vendors/">Vendors</a></li>
                <li><a href="https://naturallyadeal.com/contact/">Contact us</a></li>
                <li><a href="https://naturallyadeal.com/faq/">FAQ</a></li>
            </ul>
        </nav>
        <form id="product-search">
            <input type="search" placeholder="Search products" class="searchbar">
        </form>
        <a href="login.html"><button class="button button-primary-light">Login or sign up</button></a>
    </header>

    <main>
        <div class="container">
            <h1>Sign up</h1>
            <form>
                <fieldset>
                    <label for="fname">First Name</label>
                    <input type="text" id="fname" name="fname">
                    <label for="lname">Last Name</label>
                    <input type="text" id="lname" name="lname">
                </fieldset>
                <fieldset>
                    <label for="email">Email</label>
                    <input type="text" id="email" name="email">
                </fieldset>
                <fieldset>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password">
                    <p>6 characters minimum</p>
                </fieldset>
                <fieldset>
                    <label for="coop-group">Choose a Co-op Group</label>
                    <p>A co-op group is the area you will pick up your items in.</p>
                    <select name="coop-group" id="coop-group">
                        <optgroup label="Alabama">
                            <option value="al-placeholder">AL-Placeholder</option>
                        </optgroup>
                        <optgroup label="Georgia">
                            <option value="ga-placeholder">GA-Placeholder</option>
                        </optgroup>
                        <optgroup label="Michigan">

                        </optgroup>
                        <optgroup label="Mississippi">

                        </optgroup>
                        <optgroup label="Nebraska">

                        </optgroup>
                        <optgroup label="North Carolina">

                        </optgroup>
                        <optgroup label="South Carolina">

                        </optgroup>
                        <optgroup label="Tennessee">

                        </optgroup>
                        <optgroup label="Virginia">

                        </optgroup>
                    </select>
                </fieldset>
                
                <fieldset>
                    <h2>Billing Address</h2>
                    <label for="address">Address 1</label>
                    <input type="text" id="address" name="address">
                    <label for="room">Address 2 (Optional)</label>
                    <input type="text" id="room" name="room">
                    <label for="city">City</label>
                    <input type="text" id="city" name="city">
                    <label for="state">State</label>
                    <input type="text" id="state" name="state">
                    <label for="zip">Zip</label>
                    <input type="text" id="zip" name="zip">
                </fieldset>
                <fieldset>
                    <input type="checkbox" id="phone-consent" name="phone-consent">
                    <label for="phone-consent">Receive phone calls if there is a issue with your order</label>
                    <label for="phone-number">Phone</label>
                    <input type="text" id="phone-number" name="phone-number">
                </fieldset>
                <input type="submit" value="Sign up" class="button button-primary-dark">
            </form>
        </div>
    </main>
</body>
</html>
