<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

    <!-- Link to Open Sans font. Copy this section to the head of new pages to use the font. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>

<body>
    <header class="ground-green">
        <!-- The logo sizes itself to fit the logo box. If you want to resize the logo, resize the logo box instead. -->
        <a class="logo-box" href="index.html"><img src="assets/images/Naturally-a-Deal-logo-white.webp" alt=""></a>
        <nav>
            <ul class="navlist">
                <li><a href="catalog.html">Products</a></li>
                <!-- These other links lead to the original naturally a deal page, because it is notrelevant to what we are trying to redesign. -->
                <li><a href="https://naturallyadeal.com/about-us/">About us</a></li>
                <li><a href="https://naturallyadeal.com/products-vendors/">Vendors</a></li>
                <li><a href="https://naturallyadeal.com/contact/">Contact us</a></li>
                <li><a href="https://naturallyadeal.com/faq/">FAQ</a></li>
            </ul>
        </nav>
        <form id="product-search">
            <input type="search" placeholder="Search products" class="searchbar">
        </form>
        <a href="login.html"><button class="button button-primary">Login or sign up</button></a>
    </header>

    <!-- Main content starts here -->
    <main class="ground-cream">
        <div class="container container-catalog">
            <section class="section">
                <h1>Catalog</h1>

                <div class="catalog-layout">
                    <div class="product-filters">
                        <h2>Filters</h2>
                        <div class="filter-list ground-light-butter">
                            <details class="filter-dropdown">
                                <summary>Category 1</summary>
                                <div class="ground-butter">
                                    <form id="product-search">
                                        <input type="search" placeholder="Search filters" class="searchbar">
                                    </form>
                                    <label for="cat1-1"><input type="checkbox" id="cat1-1" name="cat1" value="Subcategory 1A"> Subcategory 1A</label>
                                    <label for="cat1-2"><input type="checkbox" id="cat1-2" name="cat1" value="Subcategory 1B"> Subcategory 1B</label>
                                    <label for="cat1-3"><input type="checkbox" id="cat1-3" name="cat1" value="Subcategory 1C"> Subcategory 1C</label>
                                </div>
                            </details>
                            <details class="filter-dropdown">
                                <summary>Category 2</summary>
                                <div class="ground-butter">
                                    <form id="product-search">
                                        <input type="search" placeholder="Search filters" class="searchbar">
                                    </form>
                                    <label for="cat2-1"><input type="checkbox" id="cat2-1" name="cat2" value="Subcategory 2A"> Subcategory 2A</label>
                                    <label for="cat2-2"><input type="checkbox" id="cat2-2" name="cat2" value="Subcategory 2B"> Subcategory 2B</label>
                                    <label for="cat2-3"><input type="checkbox" id="cat2-3" name="cat2" value="Subcategory 2C"> Subcategory 2C</label>
                                </div>
                            </details>
                            <details class="filter-dropdown">
                                <summary>Category 3</summary>
                                <div class="ground-butter">
                                    <form id="product-search">
                                        <input type="search" placeholder="Search filters" class="searchbar">
                                    </form>
                                    <label for="cat3-1"><input type="checkbox" id="cat3-1" name="cat3" value="Subcategory 3A"> Subcategory 3A</label>
                                    <label for="cat3-2"><input type="checkbox" id="cat3-2" name="cat3" value="Subcategory 3B"> Subcategory 3B</label>
                                    <label for="cat3-3"><input type="checkbox" id="cat3-3" name="cat3" value="Subcategory 3C"> Subcategory 3C</label>
                                </div>
                            </details>
                            <details class="filter-dropdown">
                                <summary>Category 4</summary>
                                <div class="ground-butter">
                                    <form id="product-search">
                                        <input type="search" placeholder="Search filters" class="searchbar">
                                    </form>
                                    <label for="cat4-1"><input type="checkbox" id="cat4-1" name="cat4" value="Subcategory 4A"> Subcategory 4A</label>
                                    <label for="cat4-2"><input type="checkbox" id="cat4-2" name="cat4" value="Subcategory 4B"> Subcategory 4B</label>
                                    <label for="cat4-3"><input type="checkbox" id="cat4-3" name="cat4" value="Subcategory 4C"> Subcategory 4C</label>
                                </div>
                            </details>
                            <details class="filter-dropdown">
                                <summary>Category 5</summary>
                                <div class="ground-butter">
                                    <form id="product-search">
                                        <input type="search" placeholder="Search filters" class="searchbar">
                                    </form>
                                    <label for="cat5-1"><input type="checkbox" id="cat5-1" name="cat5" value="Subcategory 5A"> Subcategory 5A</label>
                                    <label for="cat5-2"><input type="checkbox" id="cat5-2" name="cat5" value="Subcategory 5B"> Subcategory 5B</label>
                                    <label for="cat5-3"><input type="checkbox" id="cat5-3" name="cat5" value="Subcategory 5C"> Subcategory 5C</label>
                                </div>
                            </details>
                        </div>
                    </div>

                    <div class="catalog-products">
                        <div id="products" class="product-grid" aria-live="polite"></div>
                        <div id="status" role="alert" hidden>
                            <p>Unable to load products.</p>
                            <p class="status-detail"></p>
                            <button class="retry button button-primary" type="button">Try again</button>
                        </div>
                    </div>

                    <template id="card-template">
                        <article class="product-card ground-white">
                            <button class="info button button-secondary" type="button">Info</button>
                            <div class="media"><img alt="" loading="lazy"></div>
                            <h3 class="name"></h3>
                            <h4 class="amount"></h4>
                            <p class="product-info">
                                <span class="storage"></span>
                                <span class="pack"></span>
                                <span class="unit"></span>
                                <span class="date"></span>
                            </p>
                            <button class="add button button-primary" type="button">Add to Cart</button>
                        </article>
                    </template>
                </div> <!-- Close catalog-layout -->
            </section>
        </div> <!-- Close container -->
    </main>
    <script src="NAD.js"></script>
</body>
</html>
